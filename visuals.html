    <script data-site-theme>
// Apply the saved theme before page content is displayed.
(() => {
    const root = document.documentElement;
    if (root.dataset.themeReady === 'true') return;

    let savedTheme;
    try {
        savedTheme = localStorage.getItem('theme');
    } catch {
        savedTheme = null;
    }

    const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)');
    let userOverride = savedTheme === 'light' || savedTheme === 'dark';
    const preferredDark = systemTheme?.matches ?? false;
    const initialDark = savedTheme === 'dark' || (savedTheme !== 'light' && preferredDark);

    // Announce the action available from the theme button.
    function updateButton() {
        const label = root.classList.contains('dark') ? 'Switch to light mode' : 'Switch to dark mode';
        document.getElementById('theme-toggle')?.setAttribute('aria-label', label);
    }

    root.classList.toggle('dark', initialDark);
    root.dataset.themeReady = 'true';

    // Handle clicks independently of header and application startup.
    document.addEventListener('click', event => {
        const button = event.target.closest?.('.site-header #theme-toggle');
        if (!button) return;
        const dark = !root.classList.contains('dark');
        userOverride = true;
        root.classList.toggle('dark', dark);
        updateButton();
        document.dispatchEvent(new Event('site-theme-change'));
        try {
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        } catch {
            // Keep the current page usable when preferences cannot be saved.
        }
    });

    // Follow system changes until the user chooses a theme.
    systemTheme?.addEventListener('change', event => {
        if (userOverride) return;
        root.classList.toggle('dark', event.matches);
        updateButton();
        document.dispatchEvent(new Event('site-theme-change'));
    });
    document.addEventListener('site-header-ready', updateButton);
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateButton, { once: true });
    } else {
        updateButton();
    }
})();
</script>

<script data-site-header>
// Connect navigation without waiting for any application modules.
(() => {
    const header = document.querySelector('.site-header');
    const button = header?.querySelector('#menu-toggle');
    const links = header?.querySelector('#mobile-menu');
    if (!button || !links || header.dataset.menuReady === 'true') return;

    // Keep footer years current without changing their appearance.
    function updateFooterYear() {
        const year = String(new Date().getFullYear());
        document.querySelectorAll('[data-current-year]').forEach(element => {
            element.textContent = year;
        });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', updateFooterYear, { once: true });
    else updateFooterYear();
    window.addEventListener('pageshow', updateFooterYear);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updateFooterYear();
    });

    const desktop = window.matchMedia('(min-width: 80rem)');

    const groups = [...header.querySelectorAll('.site-nav-group')];

    // Show one submenu and keep its disclosure state in sync.
    function setSubmenu(group, expanded) {
        group.querySelector('.site-submenu').hidden = !expanded;
        group.querySelector('.site-submenu-toggle').setAttribute('aria-expanded', String(expanded));
    }

    function closeSubmenus(except) {
        groups.forEach(group => {
            if (group !== except) setSubmenu(group, false);
        });
    }

    groups.forEach(group => {
        const toggle = group.querySelector('.site-submenu-toggle');
        const submenu = group.querySelector('.site-submenu');
        const open = () => {
            closeSubmenus(group);
            setSubmenu(group, true);
        };
        toggle.addEventListener('click', () => {
            const expanded = toggle.getAttribute('aria-expanded') === 'true';
            closeSubmenus();
            setSubmenu(group, !expanded);
        });
        group.addEventListener('pointerenter', event => {
            if (desktop.matches && event.pointerType === 'mouse') open();
        });
        group.addEventListener('pointerleave', event => {
            if (event.pointerType === 'mouse' && !group.contains(document.activeElement)) setSubmenu(group, false);
        });
        group.addEventListener('focusout', event => {
            if (!group.contains(event.relatedTarget)) setSubmenu(group, false);
        });
        group.addEventListener('keydown', event => {
            if (event.key === 'ArrowDown' && !submenu.contains(event.target)) {
                event.preventDefault();
                open();
                submenu.querySelector('a').focus();
            }
            if (event.key === 'Escape' && !submenu.hidden) {
                event.preventDefault();
                event.stopPropagation();
                setSubmenu(group, false);
                toggle.focus();
            }
        });
        setSubmenu(group, false);
        toggle.hidden = false;
    });

    document.addEventListener('click', event => {
        if (!groups.some(group => group.contains(event.target))) closeSubmenus();
    });

    // Keep visibility and the button's announced state together.
    function setExpanded(expanded) {
        if (!expanded) closeSubmenus();
        header.dataset.menuOpen = String(expanded);
        button.setAttribute('aria-expanded', String(expanded));
        button.setAttribute('aria-label', expanded ? 'Close navigation' : 'Open navigation');
    }

    button.addEventListener('click', () => {
        setExpanded(button.getAttribute('aria-expanded') !== 'true');
    });

    // Close navigation before following its destination.
    links.addEventListener('click', event => {
        if (event.target.closest('a')) setExpanded(false);
    });

    // Return focus to the menu button when Escape closes the list.
    header.addEventListener('keydown', event => {
        if (event.key !== 'Escape' || button.getAttribute('aria-expanded') !== 'true') return;
        event.preventDefault();
        setExpanded(false);
        button.focus();
    });

    // Keep focus out of links that become collapsed after resizing.
    desktop.addEventListener('change', () => {
        if (!desktop.matches && links.contains(document.activeElement)) button.focus();
        else groups.forEach(group => {
            if (group.querySelector('.site-submenu').contains(document.activeElement)) group.querySelector('.site-submenu-toggle').focus();
        });
        setExpanded(false);
    });

    // Move keyboard focus as well as the scroll position past navigation.
    header.querySelector('.site-skip-link')?.addEventListener('click', () => {
        setExpanded(false);
        document.getElementById('main-content')?.focus({ preventScroll: true });
    });

    setExpanded(false);
    header.dataset.menuReady = 'true';
    button.hidden = false;
    document.dispatchEvent(new Event('site-header-ready'));
})();
</script>
